<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Você ❤</title>
    <!-- linkagem do CSS -->
     <link rel="stylesheet" href="style.css">
</head> 
<body>

    <!-- Caixa principal 'janelinha'-->
     <div class="window">
     <div class="title-bar">
        <span>LOVE</span>
        <div class="controls">
            <button class="win-btn">-</button>
            <button class="win-btn">▪</button>
            <button class="win-btn">x</button>
        </div>
     </div>
    
    <!-- Conteúdo da janela -->
    <div class="content">
        <!-- a pergunta central -->
         <p class="question"> Happy 1 month my dear!<br> Wanna go out to celebrate?</p>       
        <!-- a imagem -->
         <img src="static/images/cute-pic.jpg" alt="us" class="cute-pic">
        <!-- área dos botões-->
         <div class="buttons">
            <button id="btn-yes">YES!</button>
            <button id="btn-no">No ☹</button>
         </div>            
        </div>
        </div>
        <!-- linkagem do script JS-->
        <script src="script.js"></script>
</body>
</html>
